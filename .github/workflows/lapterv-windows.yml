name: Lapterv - Windows EXE telepito

on:
  push:
    branches: [main]
    paths:
      - 'GITHUBRA_FELTOLTENDO/**'
      - '.github/workflows/lapterv-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-telepito:
    name: Windows 64 bites telepito forditas
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: GITHUBRA_FELTOLTENDO
    steps:
      - name: Forraskod letoltese
        uses: actions/checkout@v4

      - name: Go telepitese
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Node.js tesztekhez
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lapterv tesztek
        run: node --test

      - name: Windows EXE es telepito keszitese
        shell: cmd
        run: call desktop-go\Build-Windows.cmd

      - name: Hordozhato kiadas es SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = 'dist/Lapterv_Telepito_0.2.0_x64.exe'
          if (-not (Test-Path $installer)) { throw 'Nem keszult el a telepito EXE!' }
          New-Item -ItemType Directory -Force -Path 'dist/portable/app' | Out-Null
          Copy-Item 'desktop-go/assets/bin/Lapterv.exe' 'dist/portable/Lapterv.exe'
          Copy-Item 'app/index.htm' 'dist/portable/app/index.htm'
          Compress-Archive -Path 'dist/portable/*' -DestinationPath 'dist/Lapterv_Portable_0.2.0.zip' -Force
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          "$hash  Lapterv_Telepito_0.2.0_x64.exe" | Set-Content -Encoding ascii 'dist/SHA256.txt'

      - name: Letoltheto Windows-telepito
        uses: actions/upload-artifact@v4
        with:
          name: Lapterv-Windows-0.2.0
          path: |
            GITHUBRA_FELTOLTENDO/dist/Lapterv_Telepito_0.2.0_x64.exe
            GITHUBRA_FELTOLTENDO/dist/Lapterv_Portable_0.2.0.zip
            GITHUBRA_FELTOLTENDO/dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
