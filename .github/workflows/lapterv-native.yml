name: Lapterv NATIV Windows 0.5

on:
  push:
    branches: [main]
    paths:
      - 'NATIV_LAPTERV_V05/**'
      - 'build-sources/lapterv05.part*'
      - '.github/workflows/lapterv-native.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-windows:
    name: Nativ Windows Forms EXE es sajat telepito
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: NATIV_LAPTERV_V05
    steps:
      - name: Forras letoltese
        uses: actions/checkout@v4

      - name: .NET 8 SDK telepitese
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Teljes natív 0.5 forrás kibontása és ellenőrzése
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = 1..6 | ForEach-Object { Join-Path $env:GITHUB_WORKSPACE ("build-sources/lapterv05.part{0:D2}" -f $_) }
          foreach ($chunk in $chunks) { if (!(Test-Path $chunk)) { throw "Hiányzó forráscsomag: $chunk" } }
          $encoded = ($chunks | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($encoded)
          $sha = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          if ($sha -ne '65334680685d787959b8a5a80289be53aa773b4985c318f5d24d2bd849a3f776') { throw "A forráscsomag sérült: $sha" }
          $compressed = [System.IO.MemoryStream]::new($bytes)
          $decoder = [System.IO.Compression.BrotliStream]::new($compressed, [System.IO.Compression.CompressionMode]::Decompress)
          $tar = Join-Path $env:RUNNER_TEMP 'lapterv05.tar'
          $output = [System.IO.File]::Create($tar)
          try { $decoder.CopyTo($output) } finally { $output.Dispose(); $decoder.Dispose(); $compressed.Dispose() }
          tar -xf $tar -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Forrás tar kibontása sikertelen' }
          if (!(Test-Path 'NATIV_LAPTERV_V05/NativeApp/Planner.cs')) { throw 'Hiányzik az optimalizáló' }
          if (!(Test-Path 'NATIV_LAPTERV_V05/NativeApp/XprgExporter.cs')) { throw 'Hiányzik az xPrg-generáló' }
          Write-Host 'A teljes 0.5-os Windows-forrás sértetlenül kibontva.'

      - name: Forrásfájlok láthatóvá tétele a GitHub repositoryban
        continue-on-error: true
        shell: pwsh
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NATIV_LAPTERV_V05
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "Publish expanded native Lapterv 0.5 source files [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw 'Forrás commit hiba' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Forrás GitHub push hiba' }
          }

      - name: Go telepitese a sajat telepitohoz
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Ellenorzes a Windows forditoval
        shell: pwsh
        run: dotnet run --project tests/Lapterv.SmokeTests.csproj -c Release

      - name: Nativ program forditasa
        shell: pwsh
        run: |
          dotnet publish NativeApp/LaptervNative.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o dist
          if (-not (Test-Path 'dist/Lapterv.exe')) { throw 'Nem keszult el a nativ Lapterv.exe!' }

      - name: Eltavolito es telepito forditasa
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'installer/assets' | Out-Null
          Copy-Item 'dist/Lapterv.exe' 'installer/assets/Lapterv.exe' -Force
          go build -C installer -trimpath -ldflags="-s -w -H=windowsgui" -o assets/Lapterv_Eltavolitas.exe ./uninstall
          if ($LASTEXITCODE -ne 0) { throw 'Eltavolito forditasa nem sikerult' }
          go build -C installer -trimpath -ldflags="-s -w -H=windowsgui" -o ../dist/Lapterv_Telepito_0.5.0_x64.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Telepito forditasa nem sikerult' }
          Compress-Archive -Path 'dist/Lapterv.exe' -DestinationPath 'dist/Lapterv_Nativ_Portable_0.5.0.zip' -Force
          Get-FileHash -Algorithm SHA256 'dist/Lapterv_Telepito_0.5.0_x64.exe' |
            ForEach-Object { "$($_.Hash)  Lapterv_Telepito_0.5.0_x64.exe" } |
            Set-Content -Encoding ascii 'dist/SHA256.txt'

      - name: Windows telepito letoltheto csomag
        uses: actions/upload-artifact@v4
        with:
          name: Lapterv-NATIV-Windows-0.5.0
          path: |
            NATIV_LAPTERV_V05/dist/Lapterv.exe
            NATIV_LAPTERV_V05/dist/Lapterv_Telepito_0.5.0_x64.exe
            NATIV_LAPTERV_V05/dist/Lapterv_Nativ_Portable_0.5.0.zip
            NATIV_LAPTERV_V05/dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
